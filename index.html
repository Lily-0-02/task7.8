<!doctype html>
<html lang="en">
  <head>

    <link rel="stylesheet" href="style.css" />
    <title>Block_5_mobile_menu</title>
  </head>
  <body>
    <aside class="menu">
      <header class="menu__header">
        <button class="menu__button">

        </button>
        <img src="image/Group (1).png" class="menu__logo" alt="CPS">
        <button class="menu__button">
          <img src="image/search.png" alt="search">
        </button>
      </header>
      <nav class="menu__nav">
        <a class="menu__item menu__item--active" href="#">Ремонт техники</a>

        <div class="menu__contact">
            <button class="menu__button">
            <img src="image/call.png" class="menu__contactme" alt="call">
             </button>
              <button class="menu__button">
            <img src="image/chat.png" class="menu__contactme" alt="chat">
            </button>
              <button class="menu__button">
            <img src="image/profile.png" class="menu__contactme" alt="profile">
            </button>
        </div>
        <a class="menu__email" href="#"> mail@cps.com</a>
        <a class="menu__phone" href="#">8 800 890 8900</a>
        <div class="menu__language">
            <button class="menu__language" type="button">RU</button>
